# 0 = pick a random free port; override via SERVER_PORT for fixed deployments.
server.port=${SERVER_PORT:0}

# ----- Content-addressed object store -----
# Root directory for all on-disk state (blobs, metadata, locks, tmp, quarantine).
objectstore.data-dir=${OBJECT_STORE_HOME:./data/object-store}
# Unreferenced blobs younger than this grace period are never reclaimed,
# protecting in-flight uploads from a concurrent GC.
objectstore.gc-grace-period=10m
# Staging files younger than this are left untouched at startup
# (they may belong to another live process sharing the directory).
objectstore.temp-sweep-min-age=10m
